name: Prepare addon download
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (addon-vX.Y.Z)
        required: true
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/package-addon.py
      - name: Create draft for review
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^addon-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          version=$(sed -n 's/^## Version: //p' addon/AzerothSurvivorsRecorder/AzerothSurvivorsRecorder.toc | tr -d '\r')
          test "$TAG" = "addon-v$version"
          test -s "release-notes/addon/$TAG.md"
          gh release create "$TAG" artifacts/*.zip --target "$GITHUB_SHA" --draft --title "$TAG" --notes-file "release-notes/addon/$TAG.md"
